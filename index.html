<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Transferts internes</title><style>
body{font-family:Arial,sans-serif;margin:0;background:#f5f7fb;color:#1f2937}.wrap{max-width:1400px;margin:auto;padding:22px}.card{background:#fff;border:1px solid #e1e6ef;border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 3px 12px #0000000a}h1{margin:0 0 16px}.tabs{display:flex;gap:8px;margin-bottom:12px}.tabs button,.btn{border:1px solid #ccd4df;background:#fff;border-radius:8px;padding:9px 13px;font-weight:700;cursor:pointer}.tabs button.active,.btn.primary{background:#1f5eff;color:#fff;border-color:#1f5eff}.anomalyCard{background:#fff4f4;border:1px solid #efb0b0;color:#a11;padding:11px;border-radius:9px;margin-bottom:12px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:1050px}th,td{border:1px solid #dfe4eb;padding:6px;font-size:12px}th{background:#f1f3f6}input,select,textarea{box-sizing:border-box;width:100%;padding:7px;border:1px solid #cbd3df;border-radius:7px}.lineactions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.row{display:grid;grid-template-columns:1.1fr 1fr 1.8fr;gap:10px;align-items:center;border:1px solid #e1e6ef;background:#fff;border-radius:10px;padding:11px;margin:7px 0}.row small{display:block;color:#718096;margin-top:2px}.status{font-weight:800;display:flex;gap:7px;align-items:center;flex-wrap:wrap}.blue{color:#175cd3}.yellow{color:#a15c00}.green{color:#16803c}.orange{color:#c2410c}.red{color:#c52222}.badge{background:#d92d20;color:#fff;border-radius:999px;padding:3px 7px;font-size:10px}.actions{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}.modalbg{position:fixed;inset:0;background:#0008;z-index:1000}.modal{position:fixed;z-index:1001;left:50%;top:4%;transform:translateX(-50%);width:min(1250px,94vw);max-height:90vh;overflow:auto;background:#fff;border-radius:14px;padding:18px}.modalHead{display:flex;justify-content:space-between}.close{border:0;background:none;font-size:26px;cursor:pointer}.grey{background:#d9d9d9!important;color:#777}.hidden{display:none}@media(max-width:800px){.row{grid-template-columns:1fr}.actions{justify-content:flex-start}}
</style></head><body><div class="wrap"><h1>Transferts internes</h1>
<div class="card"><div class="tabs"><button id="tabTodo" class="active">Voir les demandes</button><button id="tabDone">Traitées</button><button id="tabAnom">Anomalies</button></div><div class="anomalyCard">⚠ <b>Anomalies</b> : <span id="anomCount">0</span> demande(s) concernée(s)</div><div id="list"></div></div>
<div class="card"><h2>Nouvelle demande</h2><div class="tablewrap"><table><thead><tr><th>Article</th><th>Désignation</th><th>N° US</th><th>Lot</th><th>Qté disponible</th><th>Qté demandée</th><th>Unité</th><th>Emplacement actuel</th><th>Emplacement souhaité</th></tr></thead><tbody id="newBody"></tbody></table></div><div class="lineactions"><button class="btn" onclick="clearLines()">Vider</button><button class="btn primary" onclick="saveRequest()">Valider la demande</button></div><p id="lotMsg"></p></div></div>
<script>
const MAX=15,KEY='transferts_demo_requests_v3';let currentTab='todo';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const load=()=>{try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return[]}};const save=a=>localStorage.setItem(KEY,JSON.stringify(a));
function addLine(){let i=document.querySelectorAll('#newBody tr').length,tr=document.createElement('tr');tr.innerHTML='<td><input data-k=article></td><td><input data-k=designation></td><td><input data-k=us maxlength=10 inputmode=numeric></td><td><input data-k=lot maxlength=10 pattern="[A-Za-z0-9]{1,10}"></td><td><input data-k=disponible type=number step=any></td><td><input data-k=demande type=number step=any></td><td><input data-k=unite></td><td><input data-k=actuel></td><td><input data-k=desire></td>';document.getElementById('newBody').appendChild(tr)}
function init(){for(let i=0;i<MAX;i++)addLine();render()}
function clearLines(){document.getElementById('newBody').innerHTML='';for(let i=0;i<MAX;i++)addLine()}
function saveRequest(){let rows=[...document.querySelectorAll('#newBody tr')],lines=[];for(let i=0;i<rows.length;i++){let o={};rows[i].querySelectorAll('[data-k]').forEach(x=>o[x.dataset.k]=x.value.trim());if(!Object.values(o).some(Boolean))continue;if(o.us&&!/^\d{10}$/.test(o.us)){alert('N° US : 10 chiffres exactement, ligne '+(i+1));return}if(o.lot&&!/^[A-Za-z0-9]{1,10}$/.test(o.lot)){alert('Lot : 1 à 10 caractères alphanumériques, ligne '+(i+1));return}if(!o.lot)o.anomalie='Lot non renseigné – ligne '+(i+1);if(o.demande==='')o.demande=o.disponible;lines.push(o)}if(!lines.length){alert('Saisissez au moins une ligne.');return}let d=new Date(),date=d.toISOString().slice(0,10),a=load(),seq=a.filter(r=>(r.date||'')===date).length+1,no=date.slice(2).replaceAll('-','')+String(seq).padStart(4,'0');a.push({numero:no,date,createdAt:new Date().toISOString(),statut:'A TRAITER',lignes:lines,anomalie:lines.some(x=>x.anomalie)});save(a);clearLines();alert('Demande '+no+' créée.');render()}
function done(r){return ['LIVREE','TERMINEE','TERMINE','TRAITEE'].includes((r.statut||'').toUpperCase())}function partial(r){return ['PARTIELLE','PARTIELLEMENT LIVREE','PARTIEL'].includes((r.statut||'').toUpperCase())}function anomaly(r){return !!(r.anomalie||r.sapBlocage||(r.lignes||[]).some(x=>x.anomalie))}
function render(){let a=load(),o={'A TRAITER':0,'PRIS EN CHARGE':1,'PARTIELLE':2};if(currentTab==='todo')a=a.filter(r=>!done(r)).sort((x,y)=>(o[x.statut]??9)-(o[y.statut]??9));else if(currentTab==='done')a=a.filter(done);else a=a.filter(r=>done(r)||partial(r)||anomaly(r));document.getElementById('anomCount').textContent=load().filter(anomaly).length;document.getElementById('list').innerHTML=a.length?a.map(r=>{let c=r.statut==='PRIS EN CHARGE'?'yellow':done(r)?'green':partial(r)?'orange':'blue';return '<div class=row><div><b>'+esc(r.numero)+'</b><small>'+esc(r.date)+'</small></div><div class="status '+c+'">'+esc(r.statut)+(anomaly(r)?'<span class=badge>ANOMALIE</span>':'')+'</div><div class=actions><button class=btn onclick="openDetail(\''+esc(r.numero)+'\')">Ouvrir</button>'+(done(r)?'':'<button class=btn onclick="takeCharge(\''+esc(r.numero)+'\')">Prise en charge</button><button class=btn onclick="delivery(\''+esc(r.numero)+'\')">Livraison</button><button class=btn onclick="sap(\''+esc(r.numero)+'\')">SAP</button>')+'<button class=btn onclick="printReq(\''+esc(r.numero)+'\')">Imprimer</button></div></div>'}).join(''):'<p>Aucune demande dans cet onglet.</p>'}
function update(no,p){let a=load(),i=a.findIndex(r=>r.numero===no);if(i<0)return;a[i]=Object.assign(a[i],p);save(a);render()}
function takeCharge(no){update(no,{statut:'PRIS EN CHARGE',datePriseEnCharge:new Date().toISOString()});alert('Demande '+no+' prise en charge.')}
function openDetail(no){let r=load().find(x=>x.numero===no);if(!r)return;alert('Demande '+no+'\nStatut : '+r.statut+'\nLignes : '+(r.lignes||[]).length)}
function delivery(no){let r=load().find(x=>x.numero===no),ls=r.lignes||[],bg=document.createElement('div');bg.className='modalbg';bg.id='deliveryModal';let rows=ls.map((l,i)=>'<tr data-i="'+i+'"><td><input class=dc type=checkbox '+(l.livree?'checked':'')+'></td><td>'+esc(l.article)+'</td><td>'+esc(l.designation)+'</td><td>'+esc(l.demande)+'</td><td><input class=dq type=number step=any value="'+(l.quantiteLivree??l.demande)+'"></td><td><input class=dr placeholder="Obligatoire si écart"></td></tr>').join('');bg.innerHTML='<div class=modal><div class=modalHead><h2>Livraison — '+esc(no)+'</h2><button class=close onclick="this.closest(\'.modalbg\').remove()">×</button></div><p>Cochez chaque ligne transférée. La quantité livrée est modifiable.</p><div class=tablewrap><table><thead><tr><th>✓</th><th>Article</th><th>Désignation</th><th>Demandée</th><th>Livrée</th><th>Motif si écart</th></tr></thead><tbody>'+rows+'</tbody></table></div><div class=lineactions><button class=btn onclick="this.closest(\'.modalbg\').remove()">Retour</button><button class="btn primary" onclick="validateDelivery(\''+esc(no)+'\')">Valider transfert</button></div></div>';document.body.appendChild(bg)}
function validateDelivery(no){let r=load().find(x=>x.numero===no),ls=[...(r.lignes||[])],rows=[...document.querySelectorAll('#deliveryModal tbody tr')],all=true,changed=false;for(let i=0;i<rows.length;i++){let c=rows[i].querySelector('.dc').checked,q=Number(rows[i].querySelector('.dq').value),d=Number(ls[i].demande||0),reason=rows[i].querySelector('.dr').value.trim();if(Math.abs(q-d)>1e-9&&!reason){alert('Motif obligatoire pour la ligne '+(i+1));return}if(!c)all=false;if(Math.abs(q-d)>1e-9)changed=true;ls[i]=Object.assign(ls[i],{livree:c,quantiteLivree:q,anomalie:Math.abs(q-d)>1e-9?reason:(ls[i].anomalie||'')})}if(all){if(!confirm('Transfert total effectué ?'))return;update(no,{lignes:ls,statut:changed?'PARTIELLE':'LIVREE',anomalie:changed})}else{if(!confirm('Transfert partiel ?'))return;update(no,{lignes:ls,statut:'PARTIELLE',anomalie:true})}document.getElementById('deliveryModal').remove();alert(all&&!changed?'Transfert total effectué.':'Transfert partiel enregistré.')}
function sap(no){if(!confirm('Transfert SAP fait ?'))return;let b=confirm('Avez vous eu un blocage SAP ?');update(no,{sapFait:true,sapBlocage:b,sapDate:new Date().toISOString(),anomalie:b||anomaly(load().find(r=>r.numero===no))});alert(b?'Blocage SAP enregistré.':'Validation SAP enregistrée.')}
function printReq(no){let r=load().find(x=>x.numero===no),ls=r.lignes||[],rows=ls.map(l=>'<tr class="'+(partial(r)&&l.livree?'grey':'')+'"><td>'+esc(l.article)+'</td><td>'+esc(l.designation)+'</td><td>'+esc(l.us)+'</td><td>'+esc(l.lot)+'</td><td>'+esc(l.quantiteLivree??l.demande)+'</td><td>'+esc(l.unite)+'</td><td>'+esc(l.actuel)+'</td><td>'+esc(l.desire)+'</td></tr>').join(''),w=window.open('','_blank','width=1200,height=800');if(!w){alert('Autorisez les fenêtres contextuelles.');return}w.document.write('<html><head><title>'+esc(no)+'</title><style>body{font-family:Arial;padding:25px}table{border-collapse:collapse;width:100%}th,td{border:1px solid #aaa;padding:7px;font-size:12px}th{background:#eee}.grey{background:#d9d9d9;color:#777}</style></head><body><h1>Transfert interne — '+esc(no)+'</h1><p>Statut : <b>'+esc(r.statut)+'</b></p><table><thead><tr><th>Article</th><th>Désignation</th><th>N° US</th><th>Lot</th><th>Quantité</th><th>Unité</th><th>Emplacement actuel</th><th>Emplacement souhaité</th></tr></thead><tbody>'+rows+'</tbody></table></body></html>');w.document.close();setTimeout(()=>w.print(),300)}
document.getElementById('tabTodo').onclick=()=>{currentTab='todo';document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));tabTodo.classList.add('active');render()};document.getElementById('tabDone').onclick=()=>{currentTab='done';document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));tabDone.classList.add('active');render()};document.getElementById('tabAnom').onclick=()=>{currentTab='anom';document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));tabAnom.classList.add('active');render()};init();
</script></body></html>
